<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - {{ app_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ static_url('css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="d-flex align-items-center justify-content-center min-vh-100 px-3">
        <form method="post" action="/dang-nhap" class="bg-white p-4 rounded shadow-sm w-100" style="max-width: 380px;">
            <h1 class="h4 mb-1">{{ app_name }}</h1>
            <p class="text-muted small mb-4">Đăng nhập để tiếp tục</p>
            {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
                <label class="form-label small" for="username">Tên đăng nhập</label>
                <input class="form-control" id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label small" for="password">Mật khẩu</label>
                <input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
        </form>
    </div>
</body>
</html>
