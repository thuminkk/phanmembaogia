{% extends "base.html" %}
{% block title %}Đổi mật khẩu - {{ app_name }}{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Đổi mật khẩu</h1>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
{% if saved %}<div class="alert alert-success">Đã đổi mật khẩu.</div>{% endif %}
<form method="post" action="/doi-mat-khau" class="bg-white p-3 rounded shadow-sm" style="max-width: 420px;">
    <div class="mb-3">
        <label class="form-label small">Mật khẩu hiện tại</label>
        <input class="form-control" type="password" name="current_password" autocomplete="current-password" required>
    </div>
    <div class="mb-3">
        <label class="form-label small">Mật khẩu mới (ít nhất 8 ký tự)</label>
        <input class="form-control" type="password" name="new_password" minlength="8" autocomplete="new-password" required>
    </div>
    <div class="mb-3">
        <label class="form-label small">Nhập lại mật khẩu mới</label>
        <input class="form-control" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
    </div>
    <button class="btn btn-primary" type="submit">Đổi mật khẩu</button>
</form>
{% endblock %}
