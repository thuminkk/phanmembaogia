<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ static_url('css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <nav class="sidebar d-flex flex-column p-3">
            <span class="fs-5 fw-bold text-white mb-4">{{ app_name }}</span>
            <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">Tổng quan</a>
            <a href="/linh-kien" class="nav-link {% if active_page == 'parts' %}active{% endif %}">Linh kiện</a>
            <a href="/du-an" class="nav-link {% if active_page == 'projects' %}active{% endif %}">Dự án</a>
            <a href="/mau-bao-gia" class="nav-link {% if active_page == 'quote_templates' %}active{% endif %}">Mẫu báo giá</a>
            <a href="/cum-tieu-chuan" class="nav-link {% if active_page == 'standard_groups' %}active{% endif %}">Cụm mẫu</a>
            <a href="/cai-dat" class="nav-link {% if active_page == 'settings' %}active{% endif %}">Cài đặt</a>
        </nav>
        <main class="content flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ static_url('js/scroll_restore.js') }}"></script>
</body>
</html>
